<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lilies For You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #24152f, #090817 70%);
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* Stars */
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from {
        opacity: 0.2;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    /* Lily */
    .lily {
      position: absolute;
      width: 130px;
      height: 230px;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .flower {
      position: absolute;
      width: 120px;
      height: 120px;
      top: 0;
      left: 5px;
    }

    .petal {
      position: absolute;
      width: 58px;
      height: 100px;
      background: linear-gradient(to bottom, #fffaff, #ffc8e5);
      border-radius: 60% 60% 45% 45%;
      left: 31px;
      top: 5px;
      transform-origin: 50% 100%;
      box-shadow: 0 0 12px rgba(255, 190, 225, 0.5);
    }

    .p1 { transform: rotate(0deg); }
    .p2 { transform: rotate(60deg); }
    .p3 { transform: rotate(120deg); }
    .p4 { transform: rotate(180deg); }
    .p5 { transform: rotate(240deg); }
    .p6 { transform: rotate(300deg); }

    .center {
      position: absolute;
      width: 25px;
      height: 25px;
      background: #ffd84d;
      border-radius: 50%;
      left: 48px;
      top: 47px;
      z-index: 5;
      box-shadow: 0 0 15px #ffd84d;
    }

    /* Stem */
    .stem {
      position: absolute;
      width: 6px;
      height: 130px;
      background: linear-gradient(to right, #2f8f46, #72c96c);
      left: 62px;
      top: 95px;
      border-radius: 10px;
    }

    .leaf {
      position: absolute;
      width: 60px;
      height: 25px;
      background: #4caf50;
      border-radius: 100% 0;
      top: 155px;
    }

    .leaf.left {
      left: 5px;
      transform: rotate(25deg);
    }

    .leaf.right {
      right: 5px;
      transform: scaleX(-1) rotate(25deg);
    }

    /* Message */
    .message {
      position: absolute;
      bottom: 55px;
      width: 100%;
      text-align: center;
      z-index: 20;
      animation: appear 3s ease forwards;
    }

    .love {
      font-size: clamp(40px, 8vw, 72px);
      letter-spacing: 8px;
      color: #ffd1e8;
      text-shadow:
        0 0 10px #ff8fc7,
        0 0 30px #ff5ca8;
      margin: 0;
    }

    .subtitle {
      font-size: clamp(20px, 4vw, 30px);
      margin-top: 15px;
      color: white;
      font-style: italic;
    }

    .heart {
      font-size: 35px;
      margin-top: 8px;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Flower positions */
    .l1 { left: 8%; top: 12%; transform: scale(.7); }
    .l2 { left: 28%; top: 5%; transform: scale(.55); }
    .l3 { left: 47%; top: 15%; transform: scale(.75); }
    .l4 { right: 25%; top: 7%; transform: scale(.6); }
    .l5 { right: 5%; top: 18%; transform: scale(.7); }

    .l6 { left: 15%; top: 43%; transform: scale(.6); }
    .l7 { right: 12%; top: 43%; transform: scale(.65); }

    @media (max-width: 600px) {
      .l2, .l4 {
        display: none;
      }

      .love {
        letter-spacing: 4px;
      }

      .message {
        bottom: 45px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Stars -->
  <div class="star" style="left:10%;top:10%"></div>
  <div class="star" style="left:20%;top:25%"></div>
  <div class="star" style="left:35%;top:12%"></div>
  <div class="star" style="left:50%;top:7%"></div>
  <div class="star" style="left:65%;top:18%"></div>
  <div class="star" style="left:80%;top:10%"></div>
  <div class="star" style="left:90%;top:30%"></div>
  <div class="star" style="left:5%;top:40%"></div>
  <div class="star" style="left:75%;top:38%"></div>
  <div class="star" style="left:42%;top:35%"></div>

  <!-- Lilies -->
  <div class="lily l1">
    <div class="flower">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="center"></div>
    </div>
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
  </div>

  <div class="lily l2">
    <div class="flower">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="center"></div>
    </div>
    <div class="stem"></div>
  </div>

  <div class="lily l3">
    <div class="flower">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="center"></div>
    </div>
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
  </div>

  <div class="lily l4">
    <div class="flower">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="center"></div>
    </div>
    <div class="stem"></div>
  </div>

  <div class="lily l5">
    <div class="flower">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="center"></div>
    </div>
    <div class="stem"></div>
    <div class="leaf left"></div>
  </div>

  <!-- Message -->
  <div class="message">
    <h1 class="love">I LOVE YOU</h1>
    <div class="subtitle">Lilies for you ❤️</div>
    <div class="heart">♥</div>
  </div>

</div>

</body>
</html>
